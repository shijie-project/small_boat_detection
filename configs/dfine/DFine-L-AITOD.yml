# D-FINE-L baseline on AI-TOD-v2: the plain HybridEncoder and the D-FINE decoder at the L scale
# (include/scale_l.yml) on the shared 280-epoch recipe. 300 queries, D-FINE's default, as the S
# scale uses; the tiles reach 2667 objects and the evaluator keeps 1500 detections per image,
# which the per-image budget of the Ours config is for.

__include__: [
  '../dataset/aitod_detection.yml',
  '../runtime.yml',
  './include/dataloader.yml',
  './include/optimizer.yml',
  './include/dfine_hgnetv2.yml',
  './include/scale_l.yml',
  './include/recipe_280.yml',
]

output_dir: ./outputs/dfine_l_aitod

DFINE:
  encoder: HybridEncoder
  decoder: DFINETransformer

DFINETransformer:
  num_queries: 300
