# D-FINE-M on Tier B, the Google Earth research tiles (../dataset/google_earth_detection.yml): the
# DFine-M-AITOD.yml architecture on the AEA fine-tuning recipe (include/recipe_aea.yml), fine-tuned
# (-t) from the 280-epoch DFine-M-AITOD run, outputs/dfine_m_aitod/2026-09-24_05-14-40/best_stg2.pth
# (ship-only AI-TOD test AP 69.3). 300 queries, D-FINE's default and the AI-TOD run's, although a
# tile holds at most 15 boats.

__include__: [
  '../dataset/google_earth_detection.yml',
  '../runtime.yml',
  './include/dataloader.yml',
  './include/optimizer.yml',
  './include/dfine_hgnetv2.yml',
  './include/scale_m.yml',
  './include/recipe_aea.yml',
]

output_dir: ./outputs/dfine_m_google_earth

DFINE:
  encoder: HybridEncoder
  decoder: DFINETransformer

DFINETransformer:
  num_queries: 300
