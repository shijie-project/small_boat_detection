# D-FINE-S on Tier B, the Google Earth research tiles (../dataset/google_earth_detection.yml): the
# DFine-S-AITOD.yml architecture on the Tier B recipe (include/recipe_google_earth.yml), fine-tuned
# (-t) from the 280-epoch DFine-S-AITOD run, outputs/dfine_s_aitod/2026-09-23_14-29-45/best_stg2.pth
# (ship-only AI-TOD test AP 64.6). 300 queries, D-FINE's default and the AI-TOD run's, although a
# tile holds at most 15 boats.

__include__: [
  '../dataset/google_earth_detection.yml',
  '../runtime.yml',
  './include/dataloader.yml',
  './include/optimizer.yml',
  './include/dfine_hgnetv2.yml',
  './include/scale_s.yml',
  './include/recipe_google_earth.yml',
]

output_dir: ./outputs/dfine_s_google_earth

DFINE:
  encoder: HybridEncoder
  decoder: DFINETransformer

DFINETransformer:
  num_queries: 300
