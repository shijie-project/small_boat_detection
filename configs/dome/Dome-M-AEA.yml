__include__: ["Dome-M-AITOD.yml"]

output_dir: ./output/dome-m-aea

eval_spatial_size: [1024, 1024]

DomeTransformer:
  min_num_select: 100
  max_num_select: 100

HybridEncoder:
  mwas_window_size: 16
  # True: recompute the FPN/PAN blocks during backward instead of storing their
  # activations -- ~30% less training memory for ~15% more time per step.
  grad_checkpoint: False

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.00002
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.00002
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0002
  betas: [0.9, 0.999]
  weight_decay: 0.000065


# Increase to search for the optimal ema
train_dataloader:
  num_workers: 0
  total_batch_size: 4
  dataset:
    img_folder: "~/Data/datasets/AEA/images/train"
    ann_file: "~/Data/datasets/AEA/annotations/train_coco.json"
    transforms:
      ops:
        - { type: RandomPhotometricDistort, p: 0.5 }
        - { type: RandomZoomOut, fill: 0 }
        - { type: RandomIoUCrop, p: 0.8 }
        - { type: SanitizeBoundingBoxes, min_size: 1 }
        - { type: RandomHorizontalFlip }
        - { type: Resize, size: [ 1024, 1024 ], }
        - { type: SanitizeBoundingBoxes, min_size: 1 }
        - { type: ConvertPILImage, dtype: 'float32', scale: True }
        - { type: ConvertBoxes, fmt: 'cxcywh', normalize: True }
      policy:
        epoch: 100
  collate_fn:
    stop_epoch: 100
    base_size: 1024
    base_size_repeat: 4
    ema_restart_decay: 0.9999
    mwas_window_size: 16


val_dataloader:
  num_workers: 4
  total_batch_size: 8
  dataset:
    transforms:
      ops:
        - { type: Resize, size: [ 1024, 1024 ], }
        - { type: ConvertPILImage, dtype: 'float32', scale: True }
    img_folder: "~/Data/datasets/AEA/images/val"
    ann_file: "~/Data/datasets/AEA/annotations/val_coco.json"
  collate_fn:
    mwas_window_size: 16