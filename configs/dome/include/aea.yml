# The AEA small-boat recipe (1 m/px nadir tiles, boats of 4-12 px): everything
# on top of a Dome-<size>-AITOD.yml architecture. Shared by Dome-M-AEA.yml and
# Dome-L-AEA.yml, so tuning it here changes both.

eval_spatial_size: [1024, 1024]

DomeTransformer:
  min_num_select: 100
  max_num_select: 100

HybridEncoder:
  mwas_window_size: 16
  # True: recompute the FPN/PAN blocks during backward instead of storing their
  # activations -- ~30% less training memory for ~15% more time per step.
  grad_checkpoint: False

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.00002
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.00002
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0002
  betas: [0.9, 0.999]
  # 628 training tiles: overfitting, not underfitting, is the risk here.
  weight_decay: 0.000125


# ~157 steps/epoch at batch 4, so decay late rather than never (the inherited
# milestones of [80, 120] with gamma 0.8 barely move the lr at all).
lr_scheduler:
  type: MultiStepLR
  milestones: [100, 140]
  gamma: 0.5


# 0.9999 is tuned for COCO, where its ~10k-step horizon is under one epoch. Here
# 10k steps is ~64 epochs, so the averaged weights would lag most of the run;
# 0.998 gives a ~3 epoch horizon instead.
ema:
  decay: 0.998
  warmups: 500


# Augmentation for 1 m/px nadir imagery of 5-20 m boats: objects are 4-12 px, a
# tile holds ~1.9 of them, and the ground sample distance is fixed.
#   - apparent size is a *feature*: never shrink the tile (RandomZoomOut, which
#     the COCO recipe applies to half the images at up to 4x, would leave boats
#     at 2-3 px), only magnify
#   - orientation carries no information: the full 8-fold dihedral group, taken
#     exactly, without resampling
#   - positives are scarce: copy-paste the tile's own boats onto its own water
#   - what does vary between scenes is illumination, sea state and sharpness
train_dataloader:
  num_workers: 4
  total_batch_size: 8
  dataset:
    img_folder: "~/Data/datasets/AEA/images/train"
    ann_file: "~/Data/datasets/AEA/annotations/train_coco.json"
    transforms:
      ops:
        - { type: RandomPhotometricDistort, p: 0.5 }
        - { type: RandomZoomOut, fill: 0 }
        - { type: RandomIoUCrop, p: 0.8 }
        - { type: SanitizeBoundingBoxes, min_size: 1 }
        - { type: RandomHorizontalFlip }
        - { type: Resize, size: [ 1024, 1024 ], }
        - { type: SanitizeBoundingBoxes, min_size: 1 }
        - { type: ConvertPILImage, dtype: 'float32', scale: True }
        - { type: ConvertBoxes, fmt: 'cxcywh', normalize: True }
      policy:
        name: stop_epoch
        epoch: 100  # last 60 epochs train on the real distribution
        # Flips and rotations stay on: they are exact symmetries of the scene,
        # not distortions, so there is nothing to anneal away.
        ops: ['CopyPasteSmallObjects', 'RandomZoomCrop', 'RandomColorJitter', 'RandomGaussianBlur']
  collate_fn:
    stop_epoch: 100  # same point; also where stage 2 (best_stg2, EMA restart) begins
    base_size: 1024
    # Batch multi-scale off: it resizes the whole batch to 768-1280, and the
    # 768/896 draws shrink a 6 px boat below the stride-4 grid. Scale jitter now
    # comes from RandomZoomCrop, which only ever magnifies.
    base_size_repeat: ~
    ema_restart_decay: 0.999
    mwas_window_size: 16


val_dataloader:
  num_workers: 4
  total_batch_size: 16
  dataset:
    transforms:
      ops:
        - { type: Resize, size: [ 1024, 1024 ], }
        - { type: ConvertPILImage, dtype: 'float32', scale: True }
    img_folder: "~/Data/datasets/AEA/images/val"
    ann_file: "~/Data/datasets/AEA/annotations/val_coco.json"
  collate_fn:
    mwas_window_size: 16
